name: Sila
options:
  bundleIdPrefix: com.socialsa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Sila:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sila
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.socialsa.sila
        PRODUCT_NAME: Sila
        INFOPLIST_FILE: Sila/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""

  SilaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: Sila
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.socialsa.sila.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  SilaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: Sila
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.socialsa.sila.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: Sila

schemes:
  Sila:
    build:
      targets:
        Sila: all
        SilaTests: [test]
        SilaUITests: [test]
    test:
      targets:
        - SilaTests
        - SilaUITests
      gatherCoverageData: true
    run:
      config: Debug
